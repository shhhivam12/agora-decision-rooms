<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Decision Rooms — Kabir in motion</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#EDF0EA;color:#242523;font:15px/1.5 Arial,sans-serif}main{max-width:880px;margin:auto;padding:32px 24px}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;letter-spacing:2.4px;margin:0}h1{font-size:32px;letter-spacing:-1.4px;line-height:1.2;margin:8px 0}p{color:#697066}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;font-size:12px;border:1px solid #D8DED4;border-radius:99px;padding:10px 16px;background:#FAFBF7;color:#242523;cursor:pointer}button[aria-pressed=true]{background:#242523;color:#FAFBF7}button:focus-visible{outline:2px solid #49715A;outline-offset:3px}.samples{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sample{background:#FAFBF7;border:1px solid #D8DED4;border-radius:28px;padding:20px;min-width:0}.sample h2{font-size:15px;font-weight:600;margin:0}.sample p{font-size:12px;margin:8px 0 0}.art{height:250px}.sample video{width:100%;height:250px;display:block;object-fit:contain;background:#E4E9E1;border-radius:20px}.caption{font-size:12px;display:flex;gap:20px;margin-top:14px}.motion-paused *{animation-play-state:paused!important}footer{font-size:12px;color:#697066;margin-top:20px}@media(max-width:560px){main{padding:24px 18px}.samples{grid-template-columns:1fr}.art,.sample video{height:210px}h1{font-size:27px}}
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/assistant-preview.tsx"></script></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDF0EA" />
    <meta name="description" content="Agora Decision Rooms — bring your people, talk it out and leave with a shared plan." />
    <link rel="icon" type="image/png" href="./decision-rooms-icon.png" />
    <title>Agora Decision Rooms — Talk together. Decide together.</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #D9DED5; }
      #root { display: flex; width: 100%; max-width: 430px; margin: 0 auto; background: #EDF0EA; box-shadow: 0 0 80px rgba(36,37,35,.12); }
      .app-boot { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:Arial,sans-serif; color:#242523; }
      .app-boot img { display:block; margin-bottom:10px; }
      .app-boot-title { font-size:22px; font-weight:600; letter-spacing:-0.8px; margin:0; }
      .app-boot-message { font-size:13px; color:#697066; margin:0; }
      button, input { font: inherit; }
      :focus-visible { outline: 2px solid #49715A; outline-offset: 3px; }
      @media (min-width: 700px) and (min-height: 800px) {
        #root { height: calc(100% - 48px); margin: 24px auto; border-radius: 38px; overflow: hidden; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="progressbar" aria-label="Opening Agora Decision Rooms" aria-busy="true">
        <img src="./decision-rooms-loader.svg" width="96" height="96" alt="" aria-hidden="true" />
        <p class="app-boot-title">Agora Decision Rooms</p>
        <p class="app-boot-message">Opening your room…</p>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
